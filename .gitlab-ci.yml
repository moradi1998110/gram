# GitLab CI for gram (Telegram Desktop UI + XMPP backend).
#
# Runner requirements:
#   * Docker executor with `privileged = true` (needed by the env-image job
#     for docker:dind) and GitLab 16.7+ (for `image:docker:user`).
#   * Internet access to github.com (tdesktop submodules) and invent.kde.org.
#   * At least 16 GB RAM, 8+ CPU cores and ~60 GB free disk.
#   * Project Settings > CI/CD > General pipelines > Timeout: 12h or more
#     (the first env-image build compiles Qt, WebRTC, FFmpeg... for hours).

stages:
  - env
  - build

variables:
  ENV_IMAGE: "$CI_REGISTRY_IMAGE/centos_env:latest"
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "1"

# Builds the Rocky Linux 8 image with every third-party library tdesktop
# needs (the same Dockerfile upstream uses) and pushes it to this project's
# container registry. Runs only when that Dockerfile changes, or on demand
# with FORCE_ENV_IMAGE=1 when running a pipeline manually.
env-image:
  stage: env
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
    GIT_SUBMODULE_STRATEGY: none
  timeout: 12h
  rules:
    - if: '$FORCE_ENV_IMAGE == "1"'
    - changes:
        - Telegram/build/docker/centos_env/**/*
  script:
    - apk add --no-cache python3 py3-jinja2
    - cd Telegram/build/docker/centos_env
    # Same settings as upstream's Linux CI: no LTO, no debug libraries.
    - DEBUG= LTO= python3 gen_dockerfile.py > Dockerfile.rendered
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -f Dockerfile.rendered -t "$ENV_IMAGE" .
    - docker push "$ENV_IMAGE"

# Builds QXmpp, then Telegram Desktop with the XMPP module, inside the image.
linux-build:
  stage: build
  image:
    name: "$ENV_IMAGE"
    docker:
      user: root
  timeout: 4h
  needs:
    - job: env-image
      optional: true
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    CCACHE_SLOPPINESS: "pch_defines,time_macros"
    CCACHE_MAXSIZE: "5G"
    QXMPP_PREFIX: "$CI_PROJECT_DIR/.qxmpp-install"
  cache:
    key: "linux-ccache-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - linux-ccache-main
    paths:
      - .ccache/
  script:
    - unset CCACHE_DISABLE
    - ./Telegram/build/xmpp/build_qxmpp.sh "$QXMPP_PREFIX"
    # build.sh runs Telegram/configure.sh and builds into ../out
    - ./Telegram/build/docker/centos_env/build.sh
        -D CMAKE_CONFIGURATION_TYPES=Release
        -D CMAKE_PREFIX_PATH="$QXMPP_PREFIX"
        -D TDESKTOP_API_TEST=ON
        -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
        -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
    - mkdir -p artifact
    - cp ../out/Release/Telegram artifact/gram
    - ls -la artifact
  artifacts:
    name: "gram-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - artifact/
    expire_in: 2 weeks
